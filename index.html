<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C2622" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Convites Diversos" />

    <!--
      title / description / canonical / og:title / og:description / og:url / twitter:title / twitter:description
      são definidos por página via <Head> (vite-react-ssg) nas rotas pré-renderizadas,
      e via applySeoMeta no cliente nas rotas dinâmicas (SPA). Não declaramos <title>
      estático aqui para evitar duplicação; o vite-react-ssg injeta o <title> de cada página.
    -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph (tags estáveis compartilhadas) -->
    <meta property="og:site_name" content="Convites Diversos" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:image"
      content="https://convitesdiversos.com.br/images/logo-convitesdiversos.png"
    />
    <meta
      property="og:image:alt"
      content="Convites Diversos — convites digitais personalizados"
    />

    <!-- Twitter Card (imagem compartilhada) -->
    <meta
      name="twitter:image"
      content="https://convitesdiversos.com.br/images/logo-convitesdiversos.png"
    />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Convites Diversos",
        "url": "https://convitesdiversos.com.br/",
        "logo": "https://convitesdiversos.com.br/images/logo-convitesdiversos.png",
        "description": "Convites digitais personalizados, animados e interativos para casamento, aniversário, chá de bebê, 15 anos, bodas e demais eventos.",
        "areaServed": {
          "@type": "Country",
          "name": "Brasil"
        }
      }
    </script>

    <!-- Schema.org: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Convites Diversos",
        "url": "https://convitesdiversos.com.br/",
        "inLanguage": "pt-BR"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
