# Blueprint Render — site estático (Vite + React)
# https://render.com/docs/static-sites
# Rotas SPA: /* → index.html (ficheiros em /assets/* continuam a servir-se primeiro).
# https://render.com/docs/redirects-rewrites
services:
  - type: web
    name: convites-eventos
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /favicon.ico
        destination: /favicon.svg
      - type: rewrite
        source: /*
        destination: /index.html
